# Development tooling only: the plugin itself is a script with no dependencies.

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
extend-select = ["E4", "E7", "B", "UP", "SIM", "RUF", "C4", "PT", "RET", "PERF", "PLE", "PLW"]

[tool.ruff.lint.per-file-ignores]
# "×" in call labels such as "helper×2" is intentional.
"tests/test_proxy_e2e.py" = ["RUF001"]

[tool.ruff.format]
exclude = ["**/*.md"]

[tool.pyrefly]
project-includes = ["plugins/pyrefly-lsp/scripts", "tests"]
search-path = ["plugins/pyrefly-lsp/scripts", "tests"]
python-version = "3.9"
# Tests run with `uvx pytest`: the repository has no environment of its own with pytest.
ignore-missing-imports = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
